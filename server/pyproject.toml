[project]
name = "diffuse-server"
version = "0.1.0"
description = "Real-time image-to-image Stable Diffusion server for Godot 4"
requires-python = ">=3.10"
dependencies = [
  "websockets>=12",
  "pillow>=10",
  "numpy>=1.26",
]

[project.optional-dependencies]
# The model. Kept optional so the protocol tests and the echo backend run
# anywhere without pulling a multi-GB torch install.
sd = [
  "torch>=2.3",
  "diffusers>=0.30",
  "transformers>=4.40",
  "accelerate>=0.30",
]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
